[project]
name = "ae-202-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course AE-202 Deep Learning and Generative AI Fundamentals"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.50",
    "sentence-transformers>=4.0",
    "tokenizers>=0.21",
    "httpx>=0.28",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[tool.uv]
package = false

# CPU wheels of PyTorch for a laptop: every lab runs on a processor
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
