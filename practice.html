ing to recognise the second"},{"key":"D","text":"The convolution's feature map shifts by four pixels; its values stay the same"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The same kernel is applied everywhere, so a shifted input gives a shifted map. Pooling and the final average then make the result insensitive to where.","misconceptions":["The fully connected layer has a separate weight for every pixel position, so a shift changes its input to every unit","Convolution is not blind to position: its feature map moves with the rug","Weight sharing concerns positions within one image; it does not reduce how many photographs are needed in general",""],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-conv","title":"What does the convolution buy?"},"level":null,"pool":"checkpoint"},{"id":"check-frozen-q1","type":"single","prompt":"Zaid extracts features for 800 training and 1,000 test photographs. Before the linear layer he standardises them. Which mean and standard deviation does he use for the test features?","options":[{"key":"A","text":"Those of the 800 training features"},{"key":"B","text":"Those of the 1,000 test features"},{"key":"C","text":"The ImageNet mean and standard deviation of the backbone"},{"key":"D","text":"Those of all 1,800 features together"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Everything fitted, including a mean, is fitted on training data and then applied unchanged to new data.","misconceptions":["","Statistics of the test set are information that will not exist for one new photograph on the upload page","The ImageNet statistics belong to the pixels entering the backbone, not to the 512 features leaving it","Pooling the two sets lets the test data shape the preprocessing, which is a leak"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-frozen","title":"Which statistics?"},"level":null,"pool":"checkpoint"},{"id":"check-finetune-q1","type":"single","prompt":"Rayan unfreezes the last block of a pretrained backbone and trains it together with a new head, one Adam optimiser at a learning rate of 0.01 for everything. After one epoch the validation accuracy is below what frozen features gave. What is the most likely cause?","options":[{"key":"A","text":"The augmentation made the training images too different"},{"key":"B","text":"Too few of the backbone's layers were left frozen"},{"key":"C","text":"The large steps overwrote the pretrained weights of the block"},{"key":"D","text":"The new head had too few weights to use the features"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Pretrained weights are a good starting point that a large learning rate destroys. Use a small rate for the block and a larger one for the head.","misconceptions":["Augmentation makes training harder and validation better; it does not push a fine-tuned model below its frozen baseline in one epoch","Freezing fewer layers gives more capacity; by itself it cannot make the starting point worse than frozen features","","The head is new in both setups and trains in seconds; it is not what differs from the frozen baseline"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-finetune","title":"What went wrong in the first epoch?"},"level":null,"pool":"checkpoint"},{"id":"check-evaluation-q1","type":"single","prompt":"On a test photograph labelled \"diamond\" the model says \"check\" with a confidence of 0.999. You look at the photograph: it shows a checked cloth. What is the right next step?","options":[{"key":"A","text":"Add the photograph to the training set with its label and fine-tune again"},{"key":"B","text":"Send it to the owner of the labels and count such cases"},{"key":"C","text":"Delete the photograph from the test set and report the new accuracy"},{"key":"D","text":"Lower the model's confidence with a threshold so that it abstains here"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A confident \"error\" against a wrong label is a finding about the data. The person who owns the labels corrects it, and the correction is recorded.","misconceptions":["The model was right; training it towards a wrong label would make it worse","","Silently dropping test items you disagree with makes the test set a matter of opinion; the label owner decides, and the change is recorded","A threshold on confidence would hide exactly the cases that reveal label faults"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-evaluation","title":"What do you do with this error?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"Frozen features reach 0.774 in 24 seconds; fine-tuning the last block reaches 0.788 in 102 seconds, on the same 1,000 test photographs. Which one goes on the upload page?","options":[{"key":"A","text":"The fine-tuned model, because its accuracy is higher"},{"key":"B","text":"The frozen-feature model, because it trains four times faster"},{"key":"C","text":"Either: the test cannot tell them apart, so decide on cost and simplicity, or test more"},{"key":"D","text":"Neither: with 800 labels a model should be trained from scratch"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A difference of 1.4 points on 1,000 photographs is 14 photographs. Say what the test can and cannot distinguish, then choose on other grounds.","misconceptions":["14 photographs in 1,000 is within the noise of this test set: the higher number alone does not settle it","Training time is paid once; it is a reason to prefer the cheap row for experiments, not by itself a reason to ship it","","From scratch reached 0.476 on the same data: transfer is clearly worth it, the question is only how much to unfreeze"],"lo":["LO4"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which row would you keep?"},"level":null,"pool":"checkpoint"},{"id":"check-tokens-q1","type":"single","prompt":"Rayan pastes 70 product descriptions into a small model with a window of 2,048 tokens. The English batch is answered; the Arabic batch of the same 70 products loses its beginning. What explains it?","options":[{"key":"A","text":"The Arabic descriptions have more characters than the English ones"},{"key":"B","text":"The Arabic descriptions need more tokens for the same content"},{"key":"C","text":"The tokeniser has no Arabic pieces and skips unknown words"},{"key":"D","text":"The model's window is smaller for right-to-left languages"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"About 62 Arabic descriptions fit where 86 English ones do: the same content is cut into more tokens.","misconceptions":["The window is counted in tokens, not characters; the Arabic descriptions are in fact shorter in characters","","A multilingual tokeniser can write any Arabic text; the issue is how many pieces it needs","The window is a fixed number of tokens whatever the language of the text"],"lo":["LO1"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-tokens","title":"Why did the Arabic prompt not fit?"},"level":null,"pool":"checkpoint"},{"id":"check-attention-q1","type":"single","prompt":"Zaid trains a small decoder to predict the next token of product descriptions and forgets the causal mask. The training loss falls to almost zero within one epoch. When he asks the model to write a description, it produces nonsense. Why?","options":[{"key":"A","text":"It memorised the training descriptions and cannot generalise"},{"key":"B","text":"It never learnt the order of the tokens in a sentence"},{"key":"C","text":"Its learning rate was too high for a model of that size"},{"key":"D","text":"In training each position could read the token it had to predict"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Without the mask the answer is in the input: the model learns to copy the next token, which does not exist when it generates.","misconceptions":["Overfitting needs many passes over little data; a loss near zero in one epoch points at a shortcut, not at memorising","A missing position signal would make learning harder, not make the training loss collapse","A rate that is too high makes the loss jump or grow; here it fell smoothly to zero",""],"lo":["LO1"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-attention","title":"What does the mask protect?"},"level":null,"pool":"checkpoint"},{"id":"check-recall-q1","type":"single","prompt":"A query has four relevant descriptions. The search returns five results; two of them are relevant. A colleague says: \"two out of five, so recall at 5 is 0.4\". What is the right figure?","options":[{"key":"A","text":"0.5: two of the four relevant descriptions were found"},{"key":"B","text":"0.4: two of the five results are relevant"},{"key":"C","text":"1.0: at least one relevant description is in the first five"},{"key":"D","text":"0.8: four relevant descriptions for five places"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Recall divides by what should come back. Dividing by what did come back is precision.","misconceptions":["","Two of five is the share of results that are relevant, which is precision at 5, not recall","Recall counts every relevant description, not whether at least one was found","The five results are what was retrieved; recall divides by what should have been"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-recall","title":"What does this recall mean?"},"level":null,"pool":"checkpoint"},{"id":"check-wall-q1","type":"single","prompt":"Rayan reads \"recall at 5: English 0.48, Arabic 0.25\" after fix B and proposes to translate every Arabic query to English first. Which reply uses what the lab measured?","options":[{"key":"A","text":"\"No need: the two numbers are within noise of each other\""},{"key":"B","text":"\"Better to replace the model by a larger one before anything else\""},{"key":"C","text":"\"Worth a test: the Arabic failures were dialect, Arabizi and spelling, which translation may or may not fix\""},{"key":"D","text":"\"It will work: the wall between the languages was the whole problem\""}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A fix is a hypothesis about a cause. The failure cases name the causes; the test on the labelled queries decides.","misconceptions":["The difference is real, yet 20 queries per group and team-written queries are a reason to test the idea, not to reject it","A larger model may help, yet nothing measured so far says that size is the cause","","The wall was handled by pairing products; the remaining Arabic failures have other causes"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-wall","title":"What do you tell Rayan?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"Pairing each result with the same product's other description took recall at 5 from 0.225 to 0.335 on the 50 labelled queries. Which sentence reports that without claiming more?","options":[{"key":"A","text":"\"Pairing fixed the model's cross-language search\""},{"key":"B","text":"\"Pairing raised recall at 5 from 0.225 to 0.335 on the queries it was designed on; new queries will confirm it\""},{"key":"C","text":"\"The search now serves Arabic and English customers equally well\""},{"key":"D","text":"\"A larger embedding model would have done better still\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A fix designed and measured on the same 50 queries is a result to confirm. Say what was measured, on what, and what comes next.","misconceptions":["The model still never crossed from one language to the other: the catalogue's own structure went around the wall","","The average hides the groups: English reached 0.475 and Arabic 0.250","No larger model was run on these queries: a claim without a measurement"],"lo":["LO5"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Which sentence is safe in a README?"},"level":null,"pool":"checkpoint"},{"id":"check-sampling-q1","type":"single","prompt":"Rayan runs Wasf at temperature 0.7 with the plain request, and 44 of 100 drafts break a rule. He wants fewer violations by tomorrow. Which change do the lab's measurements support first?","options":[{"key":"A","text":"Set the temperature to 0, so that the output is fixed and correct"},{"key":"B","text":"Raise top_p to 1.0, so that the model has more words to choose from"},{"key":"C","text":"Sample five drafts for each product and keep the longest one"},{"key":"D","text":"Keep temperature 0.7 and add the strict instruction with the four rules"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With the strict instruction the share of drafts breaking a rule fell from 0.44 to 0.05 at the same temperature. No sampling setting came close.","misconceptions":["At temperature 0 a quarter of the drafts still broke a rule: repeatable is not the same as right","A larger nucleus keeps more of the tail, and the tail is where the violations come from","Length was the rule broken most often: keeping the longest draft selects for the fault",""],"lo":["LO6"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-sampling","title":"Which change does the table support?"},"level":null,"pool":"checkpoint"},{"id":"check-base-q1","type":"single","prompt":"Zaid sends \"Which colour is this product? Answer with one word.\" to the base model at temperature 0 and gets nothing useful. He must keep this model. What should he change?","options":[{"key":"A","text":"Write two solved examples, leave the new answer open, and keep the first line of the output"},{"key":"B","text":"Lower the temperature further"},{"key":"C","text":"Put \"You are a helpful assistant\" in front of the question"},{"key":"D","text":"Raise the limit of new tokens"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A base model continues text. Give it a text whose likeliest continuation is the answer, and cut where the answer ends.","misconceptions":["","The run was already at temperature 0: the fault is in the text being continued, not in the draw","A base model was not trained on that convention: the sentence is just more text to continue","The base model does not stop by itself: more tokens give more text after the answer, not a better answer"],"lo":["LO6"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-base","title":"How do you get an answer out of a base model?"},"level":null,"pool":"checkpoint"},{"id":"check-limits-q1","type":"single","prompt":"A script sends the shop policy, then 110 catalogue lines, then a question on returns, about 3,400 tokens in all, to a runtime with a window of 2,048 at temperature 0. The answer is \"60 days\"; the policy says 14. What happened?","options":[{"key":"A","text":"The policy was written after the model's training cut-off"},{"key":"B","text":"The sampling settings let an unlikely token through"},{"key":"C","text":"The runtime dropped the start of the prompt, the policy with it, and the model answered without it"},{"key":"D","text":"The model cannot read numbers reliably in a long text"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"About 1,400 tokens were cut from the start. The model never saw the policy and produced a plausible number.","misconceptions":["The cut-off concerns what is in the weights; here the policy was supplied in the prompt as typed","At temperature 0 there is no draw: the same wrong answer comes back every time","","With the policy placed last in an equally long prompt, all four answers were right"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-limits","title":"Where did \"60 days\" come from?"},"level":null,"pool":"checkpoint"},{"id":"check-choice-q1","type":"single","prompt":"A colleague proposes Qwen2.5-3B-Instruct for Wasf: \"six times the weights, same family, surely better lines\". What do you say first?","options":[{"key":"A","text":"\"Let us measure its drafts on the 20 products, then decide\""},{"key":"B","text":"\"Licence first: this size has a research licence, unlike its siblings, so a shop may not use it\""},{"key":"C","text":"\"Same family as our Apache 2.0 model, so only the file size needs checking\""},{"key":"D","text":"\"A larger model is too slow for us, so there is no need to look further\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The screen comes before the comparison, and the licence is its first line. At 6,200 MB the file would not fit the shop's server either.","misconceptions":["Quality first makes it the favourite; a model the shop may not use cannot be chosen however well it writes","","This size carries other terms than the 0.5B and 7B models of the same family: each size is read separately","It probably is slower, yet latency is measured, not assumed, and the licence settles the matter sooner"],"lo":["LO7"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-choice","title":"What is the first reply?"},"level":null,"pool":"checkpoint"},{"id":"q-tensor-01","type":"single","prompt":"A batch holds 16 swatches. Each swatch is 24 by 24 grey pixels, flattened to 576 numbers. The first layer of the network is a linear layer from 576 inputs to 32 outputs. What is the shape of the output of this layer?","options":[{"key":"A","text":"(32, 576)"},{"key":"B","text":"(16, 576)"},{"key":"C","text":"(16, 32)"},{"key":"D","text":"(32,)"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A linear layer changes the last dimension only: 16 swatches go in, 16 rows of 32 numbers come out.","misconceptions":["Gives the shape of the layer's weight matrix","Gives the shape of the input batch","","Forgets that the batch dimension stays"],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-gradient-01","type":"numeric","prompt":"A model has one weight w. Its loss for one example is L = (w × x − y)², with x = 2, y = 10 and w = 3. What is the gradient of L with respect to w?","options":[],"correct":[],"answer":-16,"tolerance":0,"unit":"","explanation":"By the chain rule, dL/dw = 2 × (w × x − y) × x = 2 × (6 − 10) × 2 = −16. The sign says that a larger w lowers the loss.","misconceptions":[],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-gradient-02","type":"single","prompt":"Zaid calls backward() on the same loss two times in a row and prints the gradient of a weight after each call. The second value is twice the first. Why?","options":[{"key":"A","text":"The new gradient was added to the stored one"},{"key":"B","text":"The learning rate was applied twice by the optimiser"},{"key":"C","text":"The loss was computed on two batches"},{"key":"D","text":"The gradient was rounded in 32 bits"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The library adds each new gradient to the stored one. This is why a training step sets the gradients to zero before backward().","misconceptions":["","Mixes up the gradient and the update made from it","Thinks backward() reads new data","Reads a factor of two as rounding error"],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-loop-01","type":"order","prompt":"Put the parts of one training step in the order in which the loop runs them.","options":[{"key":"A","text":"Take the next mini-batch of inputs and labels"},{"key":"B","text":"Compute the outputs of the model for the batch"},{"key":"C","text":"Compute the loss from the outputs and the labels"},{"key":"D","text":"Set the stored gradients to zero and call backward() on the loss"},{"key":"E","text":"Let the optimiser change the weights"}],"correct":[0,1,2,3,4],"answer":null,"tolerance":null,"unit":null,"explanation":"Outputs need the batch, the loss needs the outputs, the gradients need the loss, and the optimiser needs the gradients.","misconceptions":["","","","",""],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-loop-02","type":"single","prompt":"The training set has 4,800 swatches. The batch size is 32 and the loop runs for 5 epochs. How many times are the weights updated?","options":[{"key":"A","text":"150"},{"key":"B","text":"750"},{"key":"C","text":"4,800"},{"key":"D","text":"24,000"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"One epoch is 4,800 / 32 = 150 batches, and each batch gives one update: 150 × 5 = 750.","misconceptions":["Counts the updates of one epoch","","Counts one update per swatch","Multiplies swatches by epochs and forgets the batch"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-loop-03","type":"single","prompt":"A script prints two numbers after each epoch. At epoch 8: training loss 0.41, validation loss 0.66, the lowest validation loss of the run. At epoch 12: training loss 0.22, validation loss 0.71. Which weights should be kept?","options":[{"key":"A","text":"Those of epoch 12, where the training loss is lowest"},{"key":"B","text":"Those of epoch 8, where the validation loss is lowest"},{"key":"C","text":"Those of a later epoch, when the two losses are equal"},{"key":"D","text":"None, because a validation loss above the training loss shows a fault"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The validation set stands for data the model has not seen. After epoch 8 the model keeps fitting the training set while it gets worse on new data.","misconceptions":["Takes the training loss as the measure of the model","","Expects the two curves to meet with more training","Reads the normal gap between the curves as a fault"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-rate-01","type":"single","prompt":"Three runs use the same model and data and differ in the learning rate only. Run A: the loss goes from 2.08 to 2.05 in five epochs. Run B: from 2.08 to 0.90. Run C: 2.08, then 14.3, then \"nan\". Which run used which learning rate?","options":[{"key":"A","text":"A the largest, B the middle one, C the smallest"},{"key":"B","text":"A the middle one, B the smallest, C the largest"},{"key":"C","text":"A the smallest, B the largest, C the middle one"},{"key":"D","text":"A the smallest, B the middle one, C the largest"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Steps that are too small barely move the loss. Steps that are too large jump past the minimum, and the loss grows until the numbers overflow.","misconceptions":["Thinks a large rate makes training slow","Thinks the smallest rate always learns best","Thinks the best run has the largest rate",""],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-batch-01","type":"single","prompt":"Bushra changes the batch size from 64 to 32 and keeps the number of epochs. What changes within one epoch?","options":[{"key":"A","text":"Twice as many updates, each one noisier"},{"key":"B","text":"Half as many updates, each from a cleaner gradient"},{"key":"C","text":"The same number of updates, each on half the data"},{"key":"D","text":"The same updates, on half of the training set"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An epoch still passes over every example once. Smaller batches mean more steps, and each step estimates the gradient from fewer examples.","misconceptions":["","Turns the relation round","Thinks the number of updates is fixed by the epoch","Thinks a smaller batch skips data"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-dropout-01","type":"single","prompt":"Zaid adds dropout to a network. The training loss goes from 0.48 to 0.80. The validation loss goes from 0.90 to 0.97. The gap between the two shrinks from 0.42 to 0.17. Which sentence may go into his report?","options":[{"key":"A","text":"Dropout removed the overfitting, so the model is better"},{"key":"B","text":"Dropout failed, because the training loss went up"},{"key":"C","text":"Dropout narrowed the gap and did not improve validation"},{"key":"D","text":"The two runs cannot be compared, since dropout changes validation"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The gap shrank because the training loss rose. The number that stands for new data, the validation loss, did not get better in this run.","misconceptions":["Reads a smaller gap as a better model","Expects a regulariser to lower the training loss","","Thinks dropout stays active during evaluation"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-debug-01","type":"single","prompt":"A new classifier for eight classes starts at a loss of 2.08 and stays there for three epochs. What is the first test on the debugging checklist?","options":[{"key":"A","text":"Train for thirty more epochs and look at the curve again"},{"key":"B","text":"Add two layers to make the model stronger"},{"key":"C","text":"Lower the dropout and the weight decay"},{"key":"D","text":"Train on one small batch until its loss is near zero"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A working loop can always memorise one batch. If it cannot, the fault is in the code and not in the data or the size of the model.","misconceptions":["Hopes that time repairs a fault","Blames the size of the model before testing the code","Tunes regularisation before the loop is known to work",""],"lo":["LO3"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-debug-02","type":"single","prompt":"In the one-batch test the loss of an eight-class classifier falls and then stops near 1.27, with every learning rate tried. The predictions on the batch are all right. The model ends with a softmax layer, and the loss is cross-entropy computed from the model's output. What is the fault?","options":[{"key":"A","text":"The learning rate is too small for the loss to reach zero in time"},{"key":"B","text":"The softmax is applied twice: in the model and in the loss"},{"key":"C","text":"The labels are no longer matched to the inputs"},{"key":"D","text":"The batch is too small to learn from"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The loss applies its own softmax. After two of them the largest possible probability of the right class stays well below 1, so the loss has a floor above zero.","misconceptions":["Ignores that every rate stops at the same value","","Ignores that all predictions on the batch are right","Thinks one batch cannot be memorised"],"lo":["LO3"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-debug-03","type":"single","prompt":"A training script passes the one-batch test. On the full training set of eight classes the loss stays at 2.08, which is ln 8. The script shuffles the inputs at the start of each epoch and reads the labels in their stored order. What does the value 2.08 say?","options":[{"key":"A","text":"The model answers at chance: inputs and labels no longer match"},{"key":"B","text":"The learning rate is too large, and the loss is about to grow quickly"},{"key":"C","text":"The model is too small for eight classes"},{"key":"D","text":"The training needs more epochs to start"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"ln 8 is the loss of a model that gives each of eight classes the same probability. With labels that do not belong to their inputs, that is the best a model can do.","misconceptions":["","Expects a flat loss before divergence","Blames capacity, though one batch was memorised","Waits, though the loss equals chance exactly"],"lo":["LO3"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-debug-04","type":"single","prompt":"The first four steps of a run print these losses: 2.1, 35.7, 912.4, nan. Which fault does the checklist look at first?","options":[{"key":"A","text":"A softmax applied twice"},{"key":"B","text":"Labels that do not match their inputs"},{"key":"C","text":"A learning rate that is far too large"},{"key":"D","text":"A validation set that is too small"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A loss that multiplies at every step means each update jumps far past the minimum. Divide the learning rate by ten and run the same steps again.","misconceptions":["Gives a floor above zero, not a loss that grows","Gives a flat loss at chance, not a loss that grows","","Looks at evaluation when training itself breaks"],"lo":["LO3"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-debug-05","type":"single","prompt":"Zaid finds a fault in a training script and changes one line. What shows, in his debugging log, that the fix worked?","options":[{"key":"A","text":"The script now runs to the end without an error"},{"key":"B","text":"The test that failed before now passes, both logged"},{"key":"C","text":"The loss of the first step is lower than before the fix"},{"key":"D","text":"A colleague has read the changed line and agrees"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A fix is shown by the same test before and after it. The log keeps both results, so that the next fault is not confused with this one.","misconceptions":["Takes \"it runs\" for \"it learns\"","","Judges from one step instead of a curve","Replaces a measurement with an opinion"],"lo":["LO3"],"day":1,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-order-01","type":"single","prompt":"Rayan trains a classifier on ten product categories. In his log the batch loss falls over a run of batches, then jumps up, again and again, and each jump comes where the category of the batch changes. After each epoch most validation products get the same category. What is the fault, and what fixes it?","options":[{"key":"A","text":"The examples arrive sorted by category; draw each batch from a new random order of the examples"},{"key":"B","text":"The inputs were shuffled without their labels; shuffle inputs and labels with the same indices"},{"key":"C","text":"The learning rate is too high for this network; lower it tenfold and train for longer"},{"key":"D","text":"Each epoch repeats the same order of batches; take the batches in a new random order"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Batches of one category teach the network to predict that category, until the next category punishes it. Only a new random order of the examples makes each batch look like the whole training set.","misconceptions":["","Broken pairs give a flat batch loss near ln 10, without runs and jumps","The jumps line up with the category changes, not with the step size","Each batch still holds a single category, whatever their order"],"lo":["LO3"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-conv-01","type":"numeric","prompt":"A convolutional layer has 16 filters. Each filter is 3 by 3 and reads 3 input channels. Each filter has one bias. How many weights does the layer have, biases included?","options":[],"correct":[],"answer":448,"tolerance":0,"unit":"weights","explanation":"Each filter has 3 × 3 × 3 = 27 weights and one bias: 16 × 28 = 448. The size of the image plays no part.","misconceptions":[],"lo":["LO4"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-conv-02","type":"single","prompt":"On the same textile photographs, a network of linear layers reaches an accuracy of 0.16. A small convolutional network with about thirty times fewer weights reaches 0.70. What explains the difference?","options":[{"key":"A","text":"The convolutional network was given more data"},{"key":"B","text":"The convolutional network reads colour and the other does not"},{"key":"C","text":"The convolutional network has more weights where it matters"},{"key":"D","text":"One small filter is applied at every position"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A filter that has learned a stripe in one place finds it everywhere. A linear layer must learn the same pattern again for every position.","misconceptions":["Ignores that the photographs are the same","Thinks flattening removes the colour channels","Thinks accuracy follows the number of weights",""],"lo":["LO4"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-conv-03","type":"single","prompt":"An image of 48 by 48 pixels passes through a 3 by 3 convolution without padding, then through a 2 by 2 max-pooling layer. What is the height of the result?","options":[{"key":"A","text":"22"},{"key":"B","text":"23"},{"key":"C","text":"24"},{"key":"D","text":"46"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Without padding a 3 by 3 filter fits 46 times along 48 pixels. Pooling by 2 halves that: 23.","misconceptions":["Subtracts the border twice","","Forgets that the convolution loses one pixel on each side","Forgets the pooling layer"],"lo":["LO4"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-head-01","type":"single","prompt":"The last convolution of a network gives 128 maps of 4 by 4 for each image. Zaid compares two heads for ten product categories: an average over all positions and then a linear layer, or flattening the maps and then a linear layer. How many weights, biases included, does the linear layer have in each head?","options":[{"key":"A","text":"20,490 after averaging; 1,290 after flattening"},{"key":"B","text":"1,280 after averaging; 20,480 after flattening"},{"key":"C","text":"1,290 after averaging; 1,290 after flattening"},{"key":"D","text":"1,290 after averaging; 20,490 after flattening"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Averaging leaves 128 numbers: 128 × 10 + 10 = 1,290. Flattening passes 128 × 4 × 4 = 2,048 numbers: 2,048 × 10 + 10 = 20,490.","misconceptions":["Swaps the two heads","Leaves out the ten biases","Thinks flattening keeps one number per map",""],"lo":["LO4"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-frozen-01","type":"numeric","prompt":"Zaid loads a pretrained network that turns a photograph into 512 features, and freezes all of it. He adds one linear layer from the 512 features to 8 classes, with biases. How many weights are trained?","options":[],"correct":[],"answer":4104,"tolerance":0,"unit":"weights","explanation":"512 × 8 = 4,096 weights and 8 biases. The millions of frozen weights are used and not changed.","misconceptions":[],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-frozen-02","type":"single","prompt":"A backbone is frozen and only a new linear layer is trained for ten epochs. Which computation can be done once and saved to a file?","options":[{"key":"A","text":"The features of every photograph"},{"key":"B","text":"The loss of every batch"},{"key":"C","text":"The gradients of the linear layer"},{"key":"D","text":"The order of the batches"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A frozen backbone gives the same features for the same photograph in every epoch. Computing them once leaves only a small linear layer to train.","misconceptions":["","Forgets that the loss changes with the trained layer","Forgets that gradients change at every step","Thinks the saving is in the data order"],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-frozen-03","type":"single","prompt":"A backbone was trained on everyday photographs of animals and objects. Its frozen features classify weaving patterns well, with 800 labels. Why can that work?","options":[{"key":"A","text":"The everyday photographs included the eight weaving patterns"},{"key":"B","text":"Freezing stops the model from overfitting, which raises accuracy"},{"key":"C","text":"Its layers detect edges and textures that most images share"},{"key":"D","text":"The new linear layer is large enough to learn vision by itself"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"What the layers learned is general: edges, then textures, then parts. The new layer only has to combine these into eight classes.","misconceptions":["Thinks transfer needs the same classes","Takes a side effect for the cause","","Gives the credit to the small trained layer"],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-labels-01","type":"single","prompt":"The shop's baskets are to be tagged with every material they use: palm leaf, wool, cotton and leather. One basket can use two or three. Zaid puts a linear layer with four outputs on frozen features. Which output and loss fit this task?","options":[{"key":"A","text":"A sigmoid on each output, binary cross-entropy, one threshold per material"},{"key":"B","text":"A softmax over the four outputs, cross-entropy, and the largest one kept"},{"key":"C","text":"A softmax over the four outputs, cross-entropy, and every output above 0.5 kept"},{"key":"D","text":"A sigmoid on each output, and cross-entropy on the number of the material"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each material is its own yes or no question, so each output gets its own sigmoid and the loss compares it with a 0 or 1 for that material. A softmax makes the materials compete for one unit of probability.","misconceptions":["","Gives each basket one material","Softmax outputs add up to 1, so two materials can never both pass 0.5","The labels must be a 0 or 1 for each material, not one class number"],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-finetune-01","type":"single","prompt":"With a frozen backbone the validation accuracy is 0.77. Zaid unfreezes the last block and trains all trainable weights with a learning rate of 0.1. After one epoch the validation accuracy is 0.31. What is the most likely cause?","options":[{"key":"A","text":"800 labels are too few for any fine-tuning"},{"key":"B","text":"The large steps overwrote the pretrained weights"},{"key":"C","text":"The new linear layer must be started again from random values"},{"key":"D","text":"The validation set is too small to show 0.77 again"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Pretrained weights are a good starting point that large steps destroy. Fine-tuning uses a rate many times smaller than training from scratch.","misconceptions":["Thinks fine-tuning cannot work with little data","","Looks for the fault in the layer that worked","Reads a fall of 46 points as noise"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-finetune-02","type":"single","prompt":"On a test set of 200 photographs, frozen features reach 0.76 and a fine-tuned model reaches 0.80. Zaid writes: \"fine-tuning is 4 points better\". What does this test support?","options":[{"key":"A","text":"Fine-tuning is better by 4 points and should be used"},{"key":"B","text":"Frozen features are better, since they train faster"},{"key":"C","text":"Both models have failed, since neither reaches 0.90"},{"key":"D","text":"The difference is 8 photographs: too few to decide"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"4 points of 200 photographs are 8 photographs. Another test set of this size could turn the order round, so the report says that the test cannot separate them.","misconceptions":["Reads a small difference on a small test as settled","Lets cost decide a question about accuracy","Judges against a target that nobody set",""],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-finetune-03","type":"single","prompt":"A results table compares training from scratch, frozen features and partial fine-tuning. What must be the same in the three rows for the comparison to be fair?","options":[{"key":"A","text":"The number of weights that each method trains"},{"key":"B","text":"The learning rate"},{"key":"C","text":"The training photographs and the test set"},{"key":"D","text":"The training time"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The rows differ in method. Everything about the data stays fixed, or a difference in accuracy could come from the data.","misconceptions":["Thinks a fair comparison fixes the thing being compared","Thinks one rate suits every method","","Takes a reported cost for a controlled condition"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-eval-01","type":"numeric","prompt":"The test set has 100 photographs of the class \"chevron\". The model names 55 of them \"chevron\", 40 \"wave\" and 5 another class. What is the recall of the class \"chevron\"? Answer as a number between 0 and 1.","options":[],"correct":[],"answer":0.55,"tolerance":0.005,"unit":"","explanation":"Recall is the share of the real chevrons that the model found: 55 of 100.","misconceptions":[],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-eval-02","type":"single","prompt":"Thirty of 1,000 test photographs are near-copies of photographs in the training set. The model is right on all thirty and on 76% of the others. Which accuracy belongs in the report as the estimate for new photographs?","options":[{"key":"A","text":"The accuracy on the 970 others, with the number of copies removed"},{"key":"B","text":"The accuracy on all 1,000, since thirty are few"},{"key":"C","text":"The accuracy on the thirty, since it shows what the model can reach"},{"key":"D","text":"The accuracy on the training set, since it has the most photographs"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A test photograph that the model has seen in training measures memory. The estimate for new photographs comes from the test photographs that are new.","misconceptions":["","Thinks a small leak cannot change the number","Takes memorised examples for ability","Takes training accuracy for an estimate"],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-eval-03","type":"single","prompt":"The model says \"stripe\" with a confidence of 0.99 for a test photograph labelled \"check\". Shaima, the master weaver, looks at the photograph: it shows stripes. What has the team found?","options":[{"key":"A","text":"An overconfident model that needs calibration before use"},{"key":"B","text":"A hard example to add to the training set"},{"key":"C","text":"A near-duplicate that leaked from training"},{"key":"D","text":"A wrong label in the test set, to correct and count"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Confident errors are where wrong labels hide. The label is corrected by a person who knows the classes, and the report says how many were corrected.","misconceptions":["Blames the model before looking at the label","Would train on a wrong label","Mixes up two different faults of a test set",""],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-token-01","type":"single","prompt":"A model reads at most 4,096 tokens at once. With its tokeniser an English description takes 20 tokens on average and an Arabic one 32. How many Arabic descriptions fit in one prompt?","options":[{"key":"A","text":"128"},{"key":"B","text":"157"},{"key":"C","text":"204"},{"key":"D","text":"4,096"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"4,096 / 32 = 128. The window is counted in tokens, and the same content costs more tokens in a language the tokeniser saw less of.","misconceptions":["","Averages the two languages","Uses the English count for Arabic text","Counts one token per description"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-token-02","type":"single","prompt":"The same Arabic sentence is 9 tokens for one tokeniser and 27 tokens for another. What explains the difference?","options":[{"key":"A","text":"The second model has more layers"},{"key":"B","text":"The second tokeniser counts letters and their marks one by one"},{"key":"C","text":"One vocabulary was built from text with little Arabic"},{"key":"D","text":"Arabic sentences get longer inside a model"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A tokeniser keeps frequent strings of its training text as single tokens. Text it saw rarely is cut into many small pieces.","misconceptions":["Ties the token count to the size of the network","Thinks tokens are characters","","Thinks the text changes, not the cutting"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-token-03","type":"single","prompt":"Rayan counts the tokens of a long prompt with the tokeniser of model A and then sends the prompt to model B. What can go wrong?","options":[{"key":"A","text":"Model B answers in the language of model A"},{"key":"B","text":"The count is wrong for model B, so the prompt may not fit"},{"key":"C","text":"Model B refuses to load the prompt"},{"key":"D","text":"Nothing, since a token is the same piece of text for all models"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A tokeniser belongs to its model. Only the tokeniser of model B says how many tokens model B will read.","misconceptions":["Thinks a tokeniser carries a language setting","","Expects an error where there is silence","Thinks there is one shared vocabulary"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-attention-01","type":"single","prompt":"A model reads \"The red rug with the diamond border is sold\". What does attention let the vector at the position of \"sold\" do?","options":[{"key":"A","text":"Copy the vector of the first token of the sentence"},{"key":"B","text":"Look up \"sold\" in a stored dictionary"},{"key":"C","text":"Read the one token just before it"},{"key":"D","text":"Gather from \"rug\" with weights it computes"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Attention gives each token a weighted mix of the other tokens. The weights are computed from the content, so \"sold\" can draw on \"rug\" across six tokens.","misconceptions":["Thinks attention has a fixed target","Thinks meaning is retrieved, not computed","Thinks a model reads only neighbours",""],"lo":["LO1"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-attention-02","type":"single","prompt":"For one token, the attention scores over three tokens are 2.0, 2.0 and 0.0. The softmax turns scores into weights. Which weights result?","options":[{"key":"A","text":"0.33, 0.33, 0.33"},{"key":"B","text":"0.47, 0.47, 0.06"},{"key":"C","text":"0.50, 0.50, 0.00"},{"key":"D","text":"1.00, 1.00, 0.00"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"e² is about 7.39 and e⁰ is 1. The weights are 7.39 / 15.78 = 0.47 twice, and 1 / 15.78 = 0.06: a score of zero still gets some weight.","misconceptions":["Thinks attention averages","","Divides the scores by their sum","Forgets that the weights sum to 1"],"lo":["LO1"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-attention-03","type":"single","prompt":"Attention is computed for \"rug red\" and for \"red rug\" with token embeddings only, without any position information. How do the two results compare?","options":[{"key":"A","text":"The same vectors in another order: order must be added"},{"key":"B","text":"Different vectors, since attention reads from left to right"},{"key":"C","text":"Different vectors, since each token number stores its place"},{"key":"D","text":"No result, since attention cannot run without positions"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Attention compares every token with every other and does not know which came first. A transformer adds position information to the embeddings for that reason.","misconceptions":["","Thinks attention has a built-in direction","Thinks the tokeniser encodes position","Expects an error where there is a silent loss"],"lo":["LO1"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-recall-01","type":"numeric","prompt":"A search is tested with 20 labelled queries. For 7 queries the right product is among the first five results. For 3 more it is at rank six to ten. For the others it is further down. What is recall at 5? Answer as a number between 0 and 1.","options":[],"correct":[],"answer":0.35,"tolerance":0.005,"unit":"","explanation":"Recall at 5 counts the queries whose right product is among the first five: 7 of 20. Rank six does not count.","misconceptions":[],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-embed-01","type":"single","prompt":"A customer types \"floor covering with lines\". The product is described as \"striped rug\". A keyword search finds nothing. A search with sentence embeddings finds the product. Why?","options":[{"key":"A","text":"The embedding model corrects the customer's words first"},{"key":"B","text":"The embedding search reads more of the catalogue"},{"key":"C","text":"The embedding model translates the query into the catalogue's words"},{"key":"D","text":"Texts with a similar meaning get similar vectors"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An embedding model maps a whole text to one vector. Similar meaning gives a high cosine similarity, also when no word is shared.","misconceptions":["Thinks the query is rewritten","Thinks the gain comes from coverage","Thinks embeddings map words to words",""],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-embed-02","type":"single","prompt":"The card of an embedding model says that a query starts with \"query: \" and a document with \"passage: \". Rayan embeds both without these prefixes. What should he expect?","options":[{"key":"A","text":"An error, since the model checks the format of its input"},{"key":"B","text":"No change, since a prefix carries no meaning"},{"key":"C","text":"A search that runs and finds less than the card says"},{"key":"D","text":"Vectors of another length"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The model was trained with the prefixes, so text without them is unlike its training text. Nothing fails, and the results are worse.","misconceptions":["Expects the model to enforce its card","Thinks a model ignores what it was trained with","","Thinks the input format sets the size of the vector"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-search-01","type":"single","prompt":"A bilingual search reaches recall at 5 of 0.30 for English queries, 0.19 for Arabic queries and 0.24 over all queries. Which numbers go into the report for the shop manager?","options":[{"key":"A","text":"The overall number, since it summarises the two"},{"key":"B","text":"The English number, since it shows what the search can do"},{"key":"C","text":"All three, since the overall one hides the weaker language"},{"key":"D","text":"None, until a number passes 0.90"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A manager who reads 0.24 does not learn that Arabic customers are served worse than English ones. A result is reported for each group it was measured on.","misconceptions":["Thinks an average is neutral","Reports the best case","","Holds back a result because it is low"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-search-02","type":"single","prompt":"Every product has one English and one Arabic description. For Arabic queries, the five results are always Arabic descriptions. The English description of the right product is never among them. What does this show about the vectors?","options":[{"key":"A","text":"They group by language before they group by product"},{"key":"B","text":"They are worse for English descriptions than for Arabic ones"},{"key":"C","text":"They do not hold the meaning of Arabic text"},{"key":"D","text":"They are missing for half of the catalogue"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Texts in the same language sit closer to each other than a text sits to its own translation. The ranking is filled by one language before the other is reached.","misconceptions":["","Reads a ranking effect as low quality in one language","Ignores that Arabic queries do find Arabic descriptions","Suspects the index before the model"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-search-03","type":"single","prompt":"Rayan studies the failures of 50 queries and designs a fix. On the same 50 queries recall at 5 rises from 0.22 to 0.34. How should the report state the result?","options":[{"key":"A","text":"As a gain of 12 points that customers will see in the shop"},{"key":"B","text":"As a gain on the design queries, to confirm on new ones"},{"key":"C","text":"As proof that the search now works in both languages"},{"key":"D","text":"As a number to leave out, since it may be too high"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A fix designed from the failures of a set fits that set. Queries that played no part in the design show what the fix is worth.","misconceptions":["Takes a result on design data for an estimate","","Reads an improvement as a solved problem","Hides a result where a caveat is needed"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-nexttoken-01","type":"single","prompt":"A language model writes a product line of about 25 tokens. How does the network produce it?","options":[{"key":"A","text":"In one run that outputs the 25 tokens together"},{"key":"B","text":"In two runs, a draft and then a correction"},{"key":"C","text":"In about 25 runs, one more token from each"},{"key":"D","text":"In one run for each token of the prompt"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"One run gives a probability for every token of the vocabulary at the next position. One token is drawn and appended, and the longer text goes in again.","misconceptions":["Thinks a model writes a text in one piece","Gives the model an editing step it does not have","","Ties the number of runs to the input"],"lo":["LO1"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-temp-01","type":"single","prompt":"At temperature 1 the next-token probabilities are 0.60 for \"A\", 0.30 for \"This\" and 0.10 for \"Hand\". The temperature is raised to 2. What happens to the three probabilities?","options":[{"key":"A","text":"They change places: \"Hand\" becomes the most likely"},{"key":"B","text":"\"A\" moves towards 1 and the others towards 0"},{"key":"C","text":"They stay the same, since temperature acts after the draw"},{"key":"D","text":"They move closer together and keep their order"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The scores are divided by the temperature before the softmax. A higher temperature flattens the distribution; the order of the tokens stays.","misconceptions":["Thinks temperature reorders tokens","Turns the effect of temperature round","Thinks temperature is not part of the distribution",""],"lo":["LO6"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-nucleus-01","type":"numeric","prompt":"The next-token probabilities, sorted, are 0.50, 0.25, 0.15, 0.06 and 0.04. Nucleus sampling runs with top_p = 0.8. The token that crosses 0.8 is kept. How many tokens can be drawn?","options":[],"correct":[],"answer":3,"tolerance":0,"unit":"tokens","explanation":"The running sums are 0.50, 0.75 and 0.90. The third token crosses 0.8 and is kept; the last two are dropped.","misconceptions":[],"lo":["LO6"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-violations-01","type":"single","prompt":"A small model drafts product lines under three settings. At temperature 0.7, 12% of the drafts break a rule. At temperature 1.5, 61% do. At temperature 1.5 with top_p = 0.5, 10% do. What does the third row show?","options":[{"key":"A","text":"top_p = 0.5 throws away half of the finished drafts"},{"key":"B","text":"The nucleus removed the unlikely tokens again"},{"key":"C","text":"Temperature 1.5 is safe for this task"},{"key":"D","text":"top_p has no effect on rule violations"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A high temperature gives weight to the tail of the distribution. A nucleus of 0.5 cuts the tail off again, and the drafts behave as at a lower temperature.","misconceptions":["Reads top_p as a filter on finished texts","","Ignores the second row","Compares the third row with the first only"],"lo":["LO6"],"day":4,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-template-01","type":"single","prompt":"A base model and an instruction-tuned model have the same architecture and the same number of weights. Given a question, the first continues with more questions and the second answers. What is different between them?","options":[{"key":"A","text":"The second has an added module that writes answers"},{"key":"B","text":"The second looks the answer up in a store of facts"},{"key":"C","text":"The second reads a longer context"},{"key":"D","text":"The second was trained further, on conversations"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Instruction tuning changes the values of the weights and nothing else. The template marks where the assistant's turn starts, and the model continues from there.","misconceptions":["Thinks tuning adds parts to the network","Thinks an assistant retrieves","Looks for the difference in the window",""],"lo":["LO1"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-fewshot-01","type":"single","prompt":"A base model should return the colour of a product. Which prompt gives it the best chance?","options":[{"key":"A","text":"The instruction \"Answer with the colour only, in one word.\""},{"key":"B","text":"The question, written three times"},{"key":"C","text":"Two solved examples, then the product with \"Colour:\" open"},{"key":"D","text":"A first line that gives the model a role"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A base model continues text. After two examples in the same layout, the most likely continuation of \"Colour:\" is a colour.","misconceptions":["Treats a base model as an assistant","Thinks repetition is emphasis for a model","","Expects a role to turn continuation into answering"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-fewshot-02","type":"single","prompt":"A base model receives a few-shot prompt that ends with \"Colour:\". It writes \"red\", then an empty line, then a new invented product with its colour, until the token limit. What should the calling program do?","options":[{"key":"A","text":"Keep the first line, or set a stop sequence"},{"key":"B","text":"Count the output as a wrong answer"},{"key":"C","text":"Raise the token limit until the model finishes"},{"key":"D","text":"Raise the temperature to break the pattern"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The answer is right. The model has not learned to end a turn, so it continues the pattern, and the program cuts where the answer ends.","misconceptions":["","Judges the whole text where the first line holds the answer","Expects a base model to end its turn","Uses sampling to repair a format"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-window-01","type":"single","prompt":"A prompt holds a shop policy, then 4,300 tokens of catalogue, then a question about the policy. The local runtime has a window of 4,096 tokens and keeps the end of a prompt that does not fit. The policy says 10 days; the model answers \"30 days\" without any warning. What happened?","options":[{"key":"A","text":"The model read the policy, and its training text said 30 days"},{"key":"B","text":"The model read the policy and miscounted"},{"key":"C","text":"The start of the prompt, with the policy, was dropped"},{"key":"D","text":"The temperature made the model pick an unlikely number"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The model can use only what is inside its window. The runtime cut the start, the policy went with it, and the model produced a likely number.","misconceptions":["Thinks the model prefers training text over the prompt","Looks for a reasoning fault where the input is missing","","Blames sampling for a missing document"],"lo":["LO1"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-limits-01","type":"single","prompt":"At temperature 0, a model gets 12 questions about a company that does not exist. It says nine times that it does not know. Three times it gives a fluent answer with a founding year. What may the limits note say?","options":[{"key":"A","text":"The model refuses 75% of the questions that it cannot answer"},{"key":"B","text":"The model fabricates sometimes; 12 questions give no rate"},{"key":"C","text":"The model has some knowledge of the company"},{"key":"D","text":"The model fabricates only when sampling is switched on"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The probe shows that fabrication happens, with nothing in the text to mark it. How often it happens needs many more questions and wordings.","misconceptions":["Turns 12 questions into a rate","","Takes fluent text for knowledge","Ignores that the runs were at temperature 0"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-limits-02","type":"single","prompt":"Asked about its knowledge, a model writes: \"My last update was in 2023.\" Its model card says the weights were published in September 2024 and gives no cut-off date. How should the team treat the model's sentence?","options":[{"key":"A","text":"As the cut-off, since a model knows its own training"},{"key":"B","text":"As proof that the model card is wrong"},{"key":"C","text":"As a date to put into every prompt"},{"key":"D","text":"As generated text, to check with dated questions"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The sentence is produced like any other: token by token, from what was likely in the training text. The team tests with questions whose answers have dates.","misconceptions":["Thinks a model can inspect itself","Ranks generated text above the publisher's record","Builds on an unverified value",""],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-choice-01","type":"single","prompt":"A shop needs a model for commercial use. Customer messages may leave its server only with a sign-off that has not been given. Model X: Apache 2.0 licence, quality 0.71, runs on the server. Model Y: research-only licence, quality 0.83, runs on the server. Model Z: hosted by a provider, quality 0.85. Which one can be recommended today?","options":[{"key":"A","text":"Model X"},{"key":"B","text":"Model Y"},{"key":"C","text":"Model Z"},{"key":"D","text":"Model Y now, with the licence to be settled later"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Licence and data constraints come first: they remove Y and Z. Quality is compared among the options that remain, and X is the one that remains.","misconceptions":["","Ranks quality before the licence","Ranks quality before the data constraint","Treats a licence as paperwork after the choice"],"lo":["LO7"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-choice-02","type":"single","prompt":"The use case: \"Given a customer's sentence, return the five most similar products of the catalogue.\" Which model family fits this task?","options":[{"key":"A","text":"A decoder that generates text token by token"},{"key":"B","text":"A diffusion model"},{"key":"C","text":"A vision-language model"},{"key":"D","text":"An encoder that returns a vector"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The task compares texts; nothing is generated. An embedding model gives one vector per text, and a similarity between vectors gives the ranking.","misconceptions":["Reaches for a chat model for every text task","Mixes up generating images and comparing texts","Picks the family with the most abilities",""],"lo":["LO7"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-choice-03","type":"numeric","prompt":"A hosted model costs 2 riyals per million input tokens and 8 riyals per million output tokens. The shop sends 50,000 requests a month. A request has 400 input tokens and 100 output tokens. What is the cost per month, in riyals?","options":[],"correct":[],"answer":80,"tolerance":0,"unit":"riyals","explanation":"Input: 50,000 × 400 = 20 million tokens, 40 riyals. Output: 50,000 × 100 = 5 million tokens, 40 riyals. Together 80 riyals.","misconceptions":[],"lo":["LO7"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-choice-04","type":"single","prompt":"A search must answer within 300 ms. On 50 queries, option A reaches recall at 5 of 0.34 at 120 ms a request, and option B reaches 0.36 at 900 ms. Which recommendation do the measurements support?","options":[{"key":"A","text":"B, since it has the highest recall"},{"key":"B","text":"B, with the budget raised to 900 ms for it"},{"key":"C","text":"A, since it meets the budget of 300 ms"},{"key":"D","text":"Neither, until both pass 0.90"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"B fails the stated budget. And 2 points on 50 queries are one query: the test does not show that B finds more.","misconceptions":["Compares quality before the latency budget","Changes the constraint to fit an option","","Sets a target the use case did not state"],"lo":["LO7"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-choice-05","type":"single","prompt":"A model of 7 billion weights is on the shortlist with its licence and its size, and without any result on the shop's task. A colleague says: \"It is the largest, choose it.\" What does the model-choice table need before this option can be compared?","options":[{"key":"A","text":"Nothing more, since the size of a model predicts quality"},{"key":"B","text":"A measurement on the shop's own task and server"},{"key":"C","text":"A benchmark score from the model card"},{"key":"D","text":"The agreement of the team"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An option enters the comparison with numbers measured on the use case. Until then it is a candidate to measure, and the table says so.","misconceptions":["Takes the number of weights for a measurement","","Takes a score on other tasks for this task","Replaces a measurement with a vote"],"lo":["LO7"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"}]}</script>
