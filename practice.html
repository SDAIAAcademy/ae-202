<h2>Day 1: Tensors and training</h2>
<ol>
<li><p>A layer computes z = a @ W + b with a of shape (32, 64) and W of shape (64, 8). You have dz, the gradient of the loss with respect to z. Which line gives the gradient for W?</p><ul><li><b>A.</b> dz @ W.T</li><li><b>B.</b> a @ dz</li><li><b>C.</b> a.T @ dz</li><li><b>D.</b> dz.sum(axis=0)</li></ul></li>
<li><p>Zaid's loop runs. The training loss falls for a few steps, then swings wildly and grows. His step has four lines: forward, loss, loss.backward(), optimiser.step(). What is the most likely cause?</p><ul><li><b>A.</b> Gradients from earlier steps are still added to each new one</li><li><b>B.</b> The model was never put in evaluation mode</li><li><b>C.</b> The batches were not shuffled between epochs</li><li><b>D.</b> The batch size of 32 is too small for this network</li></ul></li>
<li><p>A network with 256 hidden units trains on 400 swatches. After 60 epochs the training loss is 0.20 and still falling; the validation loss reached 0.93 at epoch 35 and is now 1.10. Which change addresses what the curves show?</p><ul><li><b>A.</b> Raise the learning rate so that training converges faster</li><li><b>B.</b> Add a second hidden layer of 256 units</li><li><b>C.</b> Train for 60 more epochs until the training loss is near zero</li><li><b>D.</b> Keep the weights of epoch 35 and get more labelled swatches</li></ul></li>
<li><p>Rayan trains a classifier on ten product categories. On 16 examples the loss reaches 0.02 in 200 steps. On the full training set it stays at 2.30 for 20 epochs, at every learning rate he tries. Where should he look first?</p><ul><li><b>A.</b> At the size of the network: it cannot hold ten categories</li><li><b>B.</b> At the data pipeline: inputs and labels no longer match</li><li><b>C.</b> At the loss function: it cannot reach zero</li><li><b>D.</b> At the learning rate: it needs a finer sweep</li></ul></li>
<li><p>A batch holds 16 swatches. Each swatch is 24 by 24 grey pixels, flattened to 576 numbers. The first layer of the network is a linear layer from 576 inputs to 32 outputs. What is the shape of the output of this layer?</p><ul><li><b>A.</b> (32, 576)</li><li><b>B.</b> (16, 576)</li><li><b>C.</b> (16, 32)</li><li><b>D.</b> (32,)</li></ul></li>
<li><p>A model has one weight w. Its loss for one example is L = (w × x − y)², with x = 2, y = 10 and w = 3. What is the gradient of L with respect to w?</p></li>
<li><p>Zaid calls backward() on the same loss two times in a row and prints the gradient of a weight after each call. The second value is twice the first. Why?</p><ul><li><b>A.</b> The new gradient was added to the stored one</li><li><b>B.</b> The learning rate was applied twice by the optimiser</li><li><b>C.</b> The loss was computed on two batches</li><li><b>D.</b> The gradient was rounded in 32 bits</li></ul></li>
<li><p>Put the parts of one training step in the order in which the loop runs them.</p><ul><li>Set the stored gradients to zero and call backward() on the loss</li><li>Take the next mini-batch of inputs and labels</li><li>Let the optimiser change the weights</li><li>Compute the loss from the outputs and the labels</li><li>Compute the outputs of the model for the batch</li></ul></li>
<li><p>The training set has 4,800 swatches. The batch size is 32 and the loop runs for 5 epochs. How many times are the weights updated?</p><ul><li><b>A.</b> 150</li><li><b>B.</b> 750</li><li><b>C.</b> 4,800</li><li><b>D.</b> 24,000</li></ul></li>
<li><p>A script prints two numbers after each epoch. At epoch 8: training loss 0.41, validation loss 0.66, the lowest validation loss of the run. At epoch 12: training loss 0.22, validation loss 0.71. Which weights should be kept?</p><ul><li><b>A.</b> Those of epoch 12, where the training loss is lowest</li><li><b>B.</b> Those of epoch 8, where the validation loss is lowest</li><li><b>C.</b> Those of a later epoch, when the two losses are equal</li><li><b>D.</b> None, because a validation loss above the training loss shows a fault</li></ul></li>
<li><p>Three runs use the same model and data and differ in the learning rate only. Run A: the loss goes from 2.08 to 2.05 in five epochs. Run B: from 2.08 to 0.90. Run C: 2.08, then 14.3, then "nan". Which run used which learning rate?</p><ul><li><b>A.</b> A the largest, B the middle one, C the smallest</li><li><b>B.</b> A the middle one, B the smallest, C the largest</li><li><b>C.</b> A the smallest, B the largest, C the middle one</li><li><b>D.</b> A the smallest, B the middle one, C the largest</li></ul></li>
<li><p>Bushra changes the batch size from 64 to 32 and keeps the number of epochs. What changes within one epoch?</p><ul><li><b>A.</b> Twice as many updates, each one noisier</li><li><b>B.</b> Half as many updates, each from a cleaner gradient</li><li><b>C.</b> The same number of updates, each on half the data</li><li><b>D.</b> The same updates, on half of the training set</li></ul></li>
<li><p>Zaid adds dropout to a network. The training loss goes from 0.48 to 0.80. The validation loss goes from 0.90 to 0.97. The gap between the two shrinks from 0.42 to 0.17. Which sentence may go into his report?</p><ul><li><b>A.</b> Dropout removed the overfitting, so the model is better</li><li><b>B.</b> Dropout failed, because the training loss went up</li><li><b>C.</b> Dropout narrowed the gap and did not improve validation</li><li><b>D.</b> The two runs cannot be compared, since dropout changes validation</li></ul></li>
<li><p>A new classifier for eight classes starts at a loss of 2.08 and stays there for three epochs. What is the first test on the debugging checklist?</p><ul><li><b>A.</b> Train for thirty more epochs and look at the curve again</li><li><b>B.</b> Add two layers to make the model stronger</li><li><b>C.</b> Lower the dropout and the weight decay</li><li><b>D.</b> Train on one small batch until its loss is near zero</li></ul></li>
<li><p>In the one-batch test the loss of an eight-class classifier falls and then stops near 1.27, with every learning rate tried. The predictions on the batch are all right. The model ends with a softmax layer, and the loss is cross-entropy computed from the model's output. What is the fault?</p><ul><li><b>A.</b> The learning rate is too small for the loss to reach zero in time</li><li><b>B.</b> The softmax is applied twice: in the model and in the loss</li><li><b>C.</b> The labels are no longer matched to the inputs</li><li><b>D.</b> The batch is too small to learn from</li></ul></li>
<li><p>A training script passes the one-batch test. On the full training set of eight classes the loss stays at 2.08, which is ln 8. The script shuffles the inputs at the start of each epoch and reads the labels in their stored order. What does the value 2.08 say?</p><ul><li><b>A.</b> The model answers at chance: inputs and labels no longer match</li><li><b>B.</b> The learning rate is too large, and the loss is about to grow quickly</li><li><b>C.</b> The model is too small for eight classes</li><li><b>D.</b> The training needs more epochs to start</li></ul></li>
<li><p>The first four steps of a run print these losses: 2.1, 35.7, 912.4, nan. Which fault does the checklist look at first?</p><ul><li><b>A.</b> A softmax applied twice</li><li><b>B.</b> Labels that do not match their inputs</li><li><b>C.</b> A learning rate that is far too large</li><li><b>D.</b> A validation set that is too small</li></ul></li>
<li><p>Zaid finds a fault in a training script and changes one line. What shows, in his debugging log, that the fix worked?</p><ul><li><b>A.</b> The script now runs to the end without an error</li><li><b>B.</b> The test that failed before now passes, both logged</li><li><b>C.</b> The loss of the first step is lower than before the fix</li><li><b>D.</b> A colleague has read the changed line and agrees</li></ul></li>
<li><p>Rayan trains a classifier on ten product categories. In his log the batch loss falls over a run of batches, then jumps up, again and again, and each jump comes where the category of the batch changes. After each epoch most validation products get the same category. What is the fault, and what fixes it?</p><ul><li><b>A.</b> The examples arrive sorted by category; draw each batch from a new random order of the examples</li><li><b>B.</b> The inputs were shuffled without their labels; shuffle inputs and labels with the same indices</li><li><b>C.</b> The learning rate is too high for this network; lower it tenfold and train for longer</li><li><b>D.</b> Each epoch repeats the same order of batches; take the batches in a new random order</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Vision and transfer</h2>
<ol>
<li><p>A new script trains an eight-class classifier. The loss stays at 2.08 for ten epochs. On 16 examples alone, with the same loss and learning rate, the loss also stays near 2.0 after 300 steps. What do you do next?</p><ul><li><b>A.</b> Tag the rows and test the data pipeline</li><li><b>B.</b> Check the loss on a perfect prediction, then sweep the learning rate on the one batch</li><li><b>C.</b> Collect more labelled examples and train again</li><li><b>D.</b> Add dropout and weight decay to stabilise the training</li></ul></li>
<li><p>Shaima photographs the same striped rug twice; in the second photograph the rug sits four pixels to the right. Which statement about the first layer of each network is right?</p><ul><li><b>A.</b> Both layers give the same output for the two photographs</li><li><b>B.</b> The convolution gives the same feature map for the two photographs</li><li><b>C.</b> The convolution needs both photographs in training to recognise the second</li><li><b>D.</b> The convolution's feature map shifts by four pixels; its values stay the same</li></ul></li>
<li><p>Zaid extracts features for 800 training and 1,000 test photographs. Before the linear layer he standardises them. Which mean and standard deviation does he use for the test features?</p><ul><li><b>A.</b> Those of the 800 training features</li><li><b>B.</b> Those of the 1,000 test features</li><li><b>C.</b> The ImageNet mean and standard deviation of the backbone</li><li><b>D.</b> Those of all 1,800 features together</li></ul></li>
<li><p>Rayan unfreezes the last block of a pretrained backbone and trains it together with a new head, one Adam optimiser at a learning rate of 0.01 for everything. After one epoch the validation accuracy is below what frozen features gave. What is the most likely cause?</p><ul><li><b>A.</b> The augmentation made the training images too different</li><li><b>B.</b> Too few of the backbone's layers were left frozen</li><li><b>C.</b> The large steps overwrote the pretrained weights of the block</li><li><b>D.</b> The new head had too few weights to use the features</li></ul></li>
<li><p>On a test photograph labelled "diamond" the model says "check" with a confidence of 0.999. You look at the photograph: it shows a checked cloth. What is the right next step?</p><ul><li><b>A.</b> Add the photograph to the training set with its label and fine-tune again</li><li><b>B.</b> Send it to the owner of the labels and count such cases</li><li><b>C.</b> Delete the photograph from the test set and report the new accuracy</li><li><b>D.</b> Lower the model's confidence with a threshold so that it abstains here</li></ul></li>
<li><p>A convolutional layer has 16 filters. Each filter is 3 by 3 and reads 3 input channels. Each filter has one bias. How many weights does the layer have, biases included? <span class="unit">(weights)</span></p></li>
<li><p>On the same textile photographs, a network of linear layers reaches an accuracy of 0.16. A small convolutional network with about thirty times fewer weights reaches 0.70. What explains the difference?</p><ul><li><b>A.</b> The convolutional network was given more data</li><li><b>B.</b> The convolutional network reads colour and the other does not</li><li><b>C.</b> The convolutional network has more weights where it matters</li><li><b>D.</b> One small filter is applied at every position</li></ul></li>
<li><p>An image of 48 by 48 pixels passes through a 3 by 3 convolution without padding, then through a 2 by 2 max-pooling layer. What is the height of the result?</p><ul><li><b>A.</b> 22</li><li><b>B.</b> 23</li><li><b>C.</b> 24</li><li><b>D.</b> 46</li></ul></li>
<li><p>The last convolution of a network gives 128 maps of 4 by 4 for each image. Zaid compares two heads for ten product categories: an average over all positions and then a linear layer, or flattening the maps and then a linear layer. How many weights, biases included, does the linear layer have in each head?</p><ul><li><b>A.</b> 20,490 after averaging; 1,290 after flattening</li><li><b>B.</b> 1,280 after averaging; 20,480 after flattening</li><li><b>C.</b> 1,290 after averaging; 1,290 after flattening</li><li><b>D.</b> 1,290 after averaging; 20,490 after flattening</li></ul></li>
<li><p>Zaid loads a pretrained network that turns a photograph into 512 features, and freezes all of it. He adds one linear layer from the 512 features to 8 classes, with biases. How many weights are trained? <span class="unit">(weights)</span></p></li>
<li><p>A backbone is frozen and only a new linear layer is trained for ten epochs. Which computation can be done once and saved to a file?</p><ul><li><b>A.</b> The features of every photograph</li><li><b>B.</b> The loss of every batch</li><li><b>C.</b> The gradients of the linear layer</li><li><b>D.</b> The order of the batches</li></ul></li>
<li><p>A backbone was trained on everyday photographs of animals and objects. Its frozen features classify weaving patterns well, with 800 labels. Why can that work?</p><ul><li><b>A.</b> The everyday photographs included the eight weaving patterns</li><li><b>B.</b> Freezing stops the model from overfitting, which raises accuracy</li><li><b>C.</b> Its layers detect edges and textures that most images share</li><li><b>D.</b> The new linear layer is large enough to learn vision by itself</li></ul></li>
<li><p>The shop's baskets are to be tagged with every material they use: palm leaf, wool, cotton and leather. One basket can use two or three. Zaid puts a linear layer with four outputs on frozen features. Which output and loss fit this task?</p><ul><li><b>A.</b> A sigmoid on each output, binary cross-entropy, one threshold per material</li><li><b>B.</b> A softmax over the four outputs, cross-entropy, and the largest one kept</li><li><b>C.</b> A softmax over the four outputs, cross-entropy, and every output above 0.5 kept</li><li><b>D.</b> A sigmoid on each output, and cross-entropy on the number of the material</li></ul></li>
<li><p>With a frozen backbone the validation accuracy is 0.77. Zaid unfreezes the last block and trains all trainable weights with a learning rate of 0.1. After one epoch the validation accuracy is 0.31. What is the most likely cause?</p><ul><li><b>A.</b> 800 labels are too few for any fine-tuning</li><li><b>B.</b> The large steps overwrote the pretrained weights</li><li><b>C.</b> The new linear layer must be started again from random values</li><li><b>D.</b> The validation set is too small to show 0.77 again</li></ul></li>
<li><p>On a test set of 200 photographs, frozen features reach 0.76 and a fine-tuned model reaches 0.80. Zaid writes: "fine-tuning is 4 points better". What does this test support?</p><ul><li><b>A.</b> Fine-tuning is better by 4 points and should be used</li><li><b>B.</b> Frozen features are better, since they train faster</li><li><b>C.</b> Both models have failed, since neither reaches 0.90</li><li><b>D.</b> The difference is 8 photographs: too few to decide</li></ul></li>
<li><p>A results table compares training from scratch, frozen features and partial fine-tuning. What must be the same in the three rows for the comparison to be fair?</p><ul><li><b>A.</b> The number of weights that each method trains</li><li><b>B.</b> The learning rate</li><li><b>C.</b> The training photographs and the test set</li><li><b>D.</b> The training time</li></ul></li>
<li><p>The test set has 100 photographs of the class "chevron". The model names 55 of them "chevron", 40 "wave" and 5 another class. What is the recall of the class "chevron"? Answer as a number between 0 and 1.</p></li>
<li><p>Thirty of 1,000 test photographs are near-copies of photographs in the training set. The model is right on all thirty and on 76% of the others. Which accuracy belongs in the report as the estimate for new photographs?</p><ul><li><b>A.</b> The accuracy on the 970 others, with the number of copies removed</li><li><b>B.</b> The accuracy on all 1,000, since thirty are few</li><li><b>C.</b> The accuracy on the thirty, since it shows what the model can reach</li><li><b>D.</b> The accuracy on the training set, since it has the most photographs</li></ul></li>
<li><p>The model says "stripe" with a confidence of 0.99 for a test photograph labelled "check". Shaima, the master weaver, looks at the photograph: it shows stripes. What has the team found?</p><ul><li><b>A.</b> An overconfident model that needs calibration before use</li><li><b>B.</b> A hard example to add to the training set</li><li><b>C.</b> A near-duplicate that leaked from training</li><li><b>D.</b> A wrong label in the test set, to correct and count</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Transformers and embeddings</h2>
<ol>
<li><p>Frozen features reach 0.774 in 24 seconds; fine-tuning the last block reaches 0.788 in 102 seconds, on the same 1,000 test photographs. Which one goes on the upload page?</p><ul><li><b>A.</b> The fine-tuned model, because its accuracy is higher</li><li><b>B.</b> The frozen-feature model, because it trains four times faster</li><li><b>C.</b> Either: the test cannot tell them apart, so decide on cost and simplicity, or test more</li><li><b>D.</b> Neither: with 800 labels a model should be trained from scratch</li></ul></li>
<li><p>Rayan pastes 70 product descriptions into a small model with a window of 2,048 tokens. The English batch is answered; the Arabic batch of the same 70 products loses its beginning. What explains it?</p><ul><li><b>A.</b> The Arabic descriptions have more characters than the English ones</li><li><b>B.</b> The Arabic descriptions need more tokens for the same content</li><li><b>C.</b> The tokeniser has no Arabic pieces and skips unknown words</li><li><b>D.</b> The model's window is smaller for right-to-left languages</li></ul></li>
<li><p>Zaid trains a small decoder to predict the next token of product descriptions and forgets the causal mask. The training loss falls to almost zero within one epoch. When he asks the model to write a description, it produces nonsense. Why?</p><ul><li><b>A.</b> It memorised the training descriptions and cannot generalise</li><li><b>B.</b> It never learnt the order of the tokens in a sentence</li><li><b>C.</b> Its learning rate was too high for a model of that size</li><li><b>D.</b> In training each position could read the token it had to predict</li></ul></li>
<li><p>A query has four relevant descriptions. The search returns five results; two of them are relevant. A colleague says: "two out of five, so recall at 5 is 0.4". What is the right figure?</p><ul><li><b>A.</b> 0.5: two of the four relevant descriptions were found</li><li><b>B.</b> 0.4: two of the five results are relevant</li><li><b>C.</b> 1.0: at least one relevant description is in the first five</li><li><b>D.</b> 0.8: four relevant descriptions for five places</li></ul></li>
<li><p>Rayan reads "recall at 5: English 0.48, Arabic 0.25" after fix B and proposes to translate every Arabic query to English first. Which reply uses what the lab measured?</p><ul><li><b>A.</b> "No need: the two numbers are within noise of each other"</li><li><b>B.</b> "Better to replace the model by a larger one before anything else"</li><li><b>C.</b> "Worth a test: the Arabic failures were dialect, Arabizi and spelling, which translation may or may not fix"</li><li><b>D.</b> "It will work: the wall between the languages was the whole problem"</li></ul></li>
<li><p>A model reads at most 4,096 tokens at once. With its tokeniser an English description takes 20 tokens on average and an Arabic one 32. How many Arabic descriptions fit in one prompt?</p><ul><li><b>A.</b> 128</li><li><b>B.</b> 157</li><li><b>C.</b> 204</li><li><b>D.</b> 4,096</li></ul></li>
<li><p>The same Arabic sentence is 9 tokens for one tokeniser and 27 tokens for another. What explains the difference?</p><ul><li><b>A.</b> The second model has more layers</li><li><b>B.</b> The second tokeniser counts letters and their marks one by one</li><li><b>C.</b> One vocabulary was built from text with little Arabic</li><li><b>D.</b> Arabic sentences get longer inside a model</li></ul></li>
<li><p>Rayan counts the tokens of a long prompt with the tokeniser of model A and then sends the prompt to model B. What can go wrong?</p><ul><li><b>A.</b> Model B answers in the language of model A</li><li><b>B.</b> The count is wrong for model B, so the prompt may not fit</li><li><b>C.</b> Model B refuses to load the prompt</li><li><b>D.</b> Nothing, since a token is the same piece of text for all models</li></ul></li>
<li><p>A model reads "The red rug with the diamond border is sold". What does attention let the vector at the position of "sold" do?</p><ul><li><b>A.</b> Copy the vector of the first token of the sentence</li><li><b>B.</b> Look up "sold" in a stored dictionary</li><li><b>C.</b> Read the one token just before it</li><li><b>D.</b> Gather from "rug" with weights it computes</li></ul></li>
<li><p>For one token, the attention scores over three tokens are 2.0, 2.0 and 0.0. The softmax turns scores into weights. Which weights result?</p><ul><li><b>A.</b> 0.33, 0.33, 0.33</li><li><b>B.</b> 0.47, 0.47, 0.06</li><li><b>C.</b> 0.50, 0.50, 0.00</li><li><b>D.</b> 1.00, 1.00, 0.00</li></ul></li>
<li><p>Attention is computed for "rug red" and for "red rug" with token embeddings only, without any position information. How do the two results compare?</p><ul><li><b>A.</b> The same vectors in another order: order must be added</li><li><b>B.</b> Different vectors, since attention reads from left to right</li><li><b>C.</b> Different vectors, since each token number stores its place</li><li><b>D.</b> No result, since attention cannot run without positions</li></ul></li>
<li><p>A search is tested with 20 labelled queries. For 7 queries the right product is among the first five results. For 3 more it is at rank six to ten. For the others it is further down. What is recall at 5? Answer as a number between 0 and 1.</p></li>
<li><p>A customer types "floor covering with lines". The product is described as "striped rug". A keyword search finds nothing. A search with sentence embeddings finds the product. Why?</p><ul><li><b>A.</b> The embedding model corrects the customer's words first</li><li><b>B.</b> The embedding search reads more of the catalogue</li><li><b>C.</b> The embedding model translates the query into the catalogue's words</li><li><b>D.</b> Texts with a similar meaning get similar vectors</li></ul></li>
<li><p>The card of an embedding model says that a query starts with "query: " and a document with "passage: ". Rayan embeds both without these prefixes. What should he expect?</p><ul><li><b>A.</b> An error, since the model checks the format of its input</li><li><b>B.</b> No change, since a prefix carries no meaning</li><li><b>C.</b> A search that runs and finds less than the card says</li><li><b>D.</b> Vectors of another length</li></ul></li>
<li><p>A bilingual search reaches recall at 5 of 0.30 for English queries, 0.19 for Arabic queries and 0.24 over all queries. Which numbers go into the report for the shop manager?</p><ul><li><b>A.</b> The overall number, since it summarises the two</li><li><b>B.</b> The English number, since it shows what the search can do</li><li><b>C.</b> All three, since the overall one hides the weaker language</li><li><b>D.</b> None, until a number passes 0.90</li></ul></li>
<li><p>Every product has one English and one Arabic description. For Arabic queries, the five results are always Arabic descriptions. The English description of the right product is never among them. What does this show about the vectors?</p><ul><li><b>A.</b> They group by language before they group by product</li><li><b>B.</b> They are worse for English descriptions than for Arabic ones</li><li><b>C.</b> They do not hold the meaning of Arabic text</li><li><b>D.</b> They are missing for half of the catalogue</li></ul></li>
<li><p>Rayan studies the failures of 50 queries and designs a fix. On the same 50 queries recall at 5 rises from 0.22 to 0.34. How should the report state the result?</p><ul><li><b>A.</b> As a gain of 12 points that customers will see in the shop</li><li><b>B.</b> As a gain on the design queries, to confirm on new ones</li><li><b>C.</b> As proof that the search now works in both languages</li><li><b>D.</b> As a number to leave out, since it may be too high</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Generation and model choice</h2>
<ol>
<li><p>Pairing each result with the same product's other description took recall at 5 from 0.225 to 0.335 on the 50 labelled queries. Which sentence reports that without claiming more?</p><ul><li><b>A.</b> "Pairing fixed the model's cross-language search"</li><li><b>B.</b> "Pairing raised recall at 5 from 0.225 to 0.335 on the queries it was designed on; new queries will confirm it"</li><li><b>C.</b> "The search now serves Arabic and English customers equally well"</li><li><b>D.</b> "A larger embedding model would have done better still"</li></ul></li>
<li><p>Rayan runs Wasf at temperature 0.7 with the plain request, and 44 of 100 drafts break a rule. He wants fewer violations by tomorrow. Which change do the lab's measurements support first?</p><ul><li><b>A.</b> Set the temperature to 0, so that the output is fixed and correct</li><li><b>B.</b> Raise top_p to 1.0, so that the model has more words to choose from</li><li><b>C.</b> Sample five drafts for each product and keep the longest one</li><li><b>D.</b> Keep temperature 0.7 and add the strict instruction with the four rules</li></ul></li>
<li><p>Zaid sends "Which colour is this product? Answer with one word." to the base model at temperature 0 and gets nothing useful. He must keep this model. What should he change?</p><ul><li><b>A.</b> Write two solved examples, leave the new answer open, and keep the first line of the output</li><li><b>B.</b> Lower the temperature further</li><li><b>C.</b> Put "You are a helpful assistant" in front of the question</li><li><b>D.</b> Raise the limit of new tokens</li></ul></li>
<li><p>A script sends the shop policy, then 110 catalogue lines, then a question on returns, about 3,400 tokens in all, to a runtime with a window of 2,048 at temperature 0. The answer is "60 days"; the policy says 14. What happened?</p><ul><li><b>A.</b> The policy was written after the model's training cut-off</li><li><b>B.</b> The sampling settings let an unlikely token through</li><li><b>C.</b> The runtime dropped the start of the prompt, the policy with it, and the model answered without it</li><li><b>D.</b> The model cannot read numbers reliably in a long text</li></ul></li>
<li><p>A colleague proposes Qwen2.5-3B-Instruct for Wasf: "six times the weights, same family, surely better lines". What do you say first?</p><ul><li><b>A.</b> "Let us measure its drafts on the 20 products, then decide"</li><li><b>B.</b> "Licence first: this size has a research licence, unlike its siblings, so a shop may not use it"</li><li><b>C.</b> "Same family as our Apache 2.0 model, so only the file size needs checking"</li><li><b>D.</b> "A larger model is too slow for us, so there is no need to look further"</li></ul></li>
<li><p>A language model writes a product line of about 25 tokens. How does the network produce it?</p><ul><li><b>A.</b> In one run that outputs the 25 tokens together</li><li><b>B.</b> In two runs, a draft and then a correction</li><li><b>C.</b> In about 25 runs, one more token from each</li><li><b>D.</b> In one run for each token of the prompt</li></ul></li>
<li><p>At temperature 1 the next-token probabilities are 0.60 for "A", 0.30 for "This" and 0.10 for "Hand". The temperature is raised to 2. What happens to the three probabilities?</p><ul><li><b>A.</b> They change places: "Hand" becomes the most likely</li><li><b>B.</b> "A" moves towards 1 and the others towards 0</li><li><b>C.</b> They stay the same, since temperature acts after the draw</li><li><b>D.</b> They move closer together and keep their order</li></ul></li>
<li><p>The next-token probabilities, sorted, are 0.50, 0.25, 0.15, 0.06 and 0.04. Nucleus sampling runs with top_p = 0.8. The token that crosses 0.8 is kept. How many tokens can be drawn? <span class="unit">(tokens)</span></p></li>
<li><p>A small model drafts product lines under three settings. At temperature 0.7, 12% of the drafts break a rule. At temperature 1.5, 61% do. At temperature 1.5 with top_p = 0.5, 10% do. What does the third row show?</p><ul><li><b>A.</b> top_p = 0.5 throws away half of the finished drafts</li><li><b>B.</b> The nucleus removed the unlikely tokens again</li><li><b>C.</b> Temperature 1.5 is safe for this task</li><li><b>D.</b> top_p has no effect on rule violations</li></ul></li>
<li><p>A base model and an instruction-tuned model have the same architecture and the same number of weights. Given a question, the first continues with more questions and the second answers. What is different between them?</p><ul><li><b>A.</b> The second has an added module that writes answers</li><li><b>B.</b> The second looks the answer up in a store of facts</li><li><b>C.</b> The second reads a longer context</li><li><b>D.</b> The second was trained further, on conversations</li></ul></li>
<li><p>A base model should return the colour of a product. Which prompt gives it the best chance?</p><ul><li><b>A.</b> The instruction "Answer with the colour only, in one word."</li><li><b>B.</b> The question, written three times</li><li><b>C.</b> Two solved examples, then the product with "Colour:" open</li><li><b>D.</b> A first line that gives the model a role</li></ul></li>
<li><p>A base model receives a few-shot prompt that ends with "Colour:". It writes "red", then an empty line, then a new invented product with its colour, until the token limit. What should the calling program do?</p><ul><li><b>A.</b> Keep the first line, or set a stop sequence</li><li><b>B.</b> Count the output as a wrong answer</li><li><b>C.</b> Raise the token limit until the model finishes</li><li><b>D.</b> Raise the temperature to break the pattern</li></ul></li>
<li><p>A prompt holds a shop policy, then 4,300 tokens of catalogue, then a question about the policy. The local runtime has a window of 4,096 tokens and keeps the end of a prompt that does not fit. The policy says 10 days; the model answers "30 days" without any warning. What happened?</p><ul><li><b>A.</b> The model read the policy, and its training text said 30 days</li><li><b>B.</b> The model read the policy and miscounted</li><li><b>C.</b> The start of the prompt, with the policy, was dropped</li><li><b>D.</b> The temperature made the model pick an unlikely number</li></ul></li>
<li><p>At temperature 0, a model gets 12 questions about a company that does not exist. It says nine times that it does not know. Three times it gives a fluent answer with a founding year. What may the limits note say?</p><ul><li><b>A.</b> The model refuses 75% of the questions that it cannot answer</li><li><b>B.</b> The model fabricates sometimes; 12 questions give no rate</li><li><b>C.</b> The model has some knowledge of the company</li><li><b>D.</b> The model fabricates only when sampling is switched on</li></ul></li>
<li><p>Asked about its knowledge, a model writes: "My last update was in 2023." Its model card says the weights were published in September 2024 and gives no cut-off date. How should the team treat the model's sentence?</p><ul><li><b>A.</b> As the cut-off, since a model knows its own training</li><li><b>B.</b> As proof that the model card is wrong</li><li><b>C.</b> As a date to put into every prompt</li><li><b>D.</b> As generated text, to check with dated questions</li></ul></li>
<li><p>A shop needs a model for commercial use. Customer messages may leave its server only with a sign-off that has not been given. Model X: Apache 2.0 licence, quality 0.71, runs on the server. Model Y: research-only licence, quality 0.83, runs on the server. Model Z: hosted by a provider, quality 0.85. Which one can be recommended today?</p><ul><li><b>A.</b> Model X</li><li><b>B.</b> Model Y</li><li><b>C.</b> Model Z</li><li><b>D.</b> Model Y now, with the licence to be settled later</li></ul></li>
<li><p>The use case: "Given a customer's sentence, return the five most similar products of the catalogue." Which model family fits this task?</p><ul><li><b>A.</b> A decoder that generates text token by token</li><li><b>B.</b> A diffusion model</li><li><b>C.</b> A vision-language model</li><li><b>D.</b> An encoder that returns a vector</li></ul></li>
<li><p>A hosted model costs 2 riyals per million input tokens and 8 riyals per million output tokens. The shop sends 50,000 requests a month. A request has 400 input tokens and 100 output tokens. What is the cost per month, in riyals? <span class="unit">(riyals)</span></p></li>
<li><p>A search must answer within 300 ms. On 50 queries, option A reaches recall at 5 of 0.34 at 120 ms a request, and option B reaches 0.36 at 900 ms. Which recommendation do the measurements support?</p><ul><li><b>A.</b> B, since it has the highest recall</li><li><b>B.</b> B, with the budget raised to 900 ms for it</li><li><b>C.</b> A, since it meets the budget of 300 ms</li><li><b>D.</b> Neither, until both pass 0.90</li></ul></li>
<li><p>A model of 7 billion weights is on the shortlist with its licence and its size, and without any result on the shop's task. A colleague says: "It is the largest, choose it." What does the model-choice table need before this option can be compared?</p><ul><li><b>A.</b> Nothing more, since the size of a model predicts quality</li><li><b>B.</b> A measurement on the shop's own task and server</li><li><b>C.</b> A benchmark score from the model card</li><li><b>D.</b> The agreement of the team</li></ul></li>
</ol>

tches. After 60 epochs the training loss is 0.20 and still falling; the validation loss reached 0.93 at epoch 35 and is now 1.10. Which change addresses what the curves show?","options":[{"key":"A","text":"Raise the learning rate so that training converges faster"},{"key":"B","text":"Add a second hidden layer of 256 units"},{"key":"C","text":"Train for 60 more epochs until the training loss is near zero"},{"key":"D","text":"Keep the weights of epoch 35 and get more labelled swatches"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Training falls while validation rises: overfitting. Stop at the best validation epoch; the lasting fix is more data.","misconceptions":["A higher rate speeds up the fall of the training loss, which is not the problem here","More capacity lets the network memorise the 400 swatches even more easily","Longer training lowers the training loss further while the validation loss keeps rising",""],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-curve","title":"What would you change first?"},"level":null,"pool":"checkpoint"},{"id":"check-one-batch-q1","type":"single","prompt":"Rayan trains a classifier on ten product categories. On 16 examples the loss reaches 0.02 in 200 steps. On the full training set it stays at 2.30 for 20 epochs, at every learning rate he tries. Where should he look first?","options":[{"key":"A","text":"At the size of the network: it cannot hold ten categories"},{"key":"B","text":"At the data pipeline: inputs and labels no longer match"},{"key":"C","text":"At the loss function: it cannot reach zero"},{"key":"D","text":"At the learning rate: it needs a finer sweep"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"One batch can be memorised, so model, loss and update work. A loss of exactly ln 10 = 2.30 on the full data means the inputs say nothing about the labels.","misconceptions":["A network too small would still beat chance a little; exactly ln 10 means
